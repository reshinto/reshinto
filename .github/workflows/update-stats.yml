name: Update GitHub Stats

on:
  workflow_dispatch:

  schedule:
    # 00:15 UTC = 08:15 Singapore time
    - cron: "15 0 * * *"

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=reshinto&show_icons=true&include_all_commits=true&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Verify generated SVG
        shell: bash
        run: |
          if [ ! -f profile/stats.svg ]; then
            echo "profile/stats.svg was not generated."
            exit 1
          fi

          if grep -q "Something went wrong" profile/stats.svg; then
            echo "GitHub stats generation returned an error SVG."
            cat profile/stats.svg
            exit 1
          fi

          if grep -q "Resource not accessible by integration" profile/stats.svg; then
            echo "GitHub API permission error detected."
            cat profile/stats.svg
            exit 1
          fi

          echo "Stats SVG generated successfully."

      - name: Commit updated stats
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg

          if git diff --cached --quiet; then
            echo "No stats changes to commit."
            exit 0
          fi

          git commit -m "chore: update GitHub profile stats"
          git push
